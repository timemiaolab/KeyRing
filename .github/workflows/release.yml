name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            name: macos-aarch64
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            name: macos-x86_64
          - platform: ubuntu-22.04
            args: ""
            name: linux-x86_64
          - platform: windows-latest
            args: ""
            name: windows-x86_64

    runs-on: ${{ matrix.platform }}
    name: ${{ matrix.name }}

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libappindicator3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils \
            pkg-config \
            libssl-dev \
            libdbus-1-dev \
            libx11-dev \
            libxtst-dev \
            libxi-dev \
            libxdo-dev \
            file

      - name: Setup Node.js
        uses: actions/setup-node@v6.5.0
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2.9.3
        with:
          workspaces: "./src-tauri -> target"
          prefix-key: "keyring-${{ matrix.name }}"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and upload installers
        uses: tauri-apps/tauri-action@v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPIMAGE_EXTRACT_AND_RUN: "1"
        with:
          tagName: v__VERSION__
          releaseName: KeyRing v__VERSION__
          releaseBody: |
            KeyRing 0.1.1 desktop installers.

            Builds are **unsigned** (no Apple Developer or Windows code-signing certificate).
            macOS uses ad-hoc signing; Gatekeeper may still warn on first open.
            Windows SmartScreen may also warn until a certificate is added.

            Download the asset that matches your platform and architecture:
            - macOS Apple Silicon (ARM): `aarch64.dmg`
            - macOS Intel: `x64.dmg`
            - Windows: `.exe` (NSIS) or `.msi`
            - Linux: `.deb` or `.AppImage`
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
