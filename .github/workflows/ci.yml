name: ci

on:
  pull_request:
  push:
    branches:
      - main
      - 'fix/**'

# Verify only. Never publish a release or upload installers.
permissions:
  contents: read

jobs:
  test:
    name: test-linux
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils \
            pkg-config \
            libssl-dev \
            libdbus-1-dev \
            libx11-dev \
            libxtst-dev \
            libxi-dev \
            libxdo-dev \
            file

      - name: Setup Node.js
        uses: actions/setup-node@v6.5.0
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2.9.3
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend lint and build
        run: |
          npm run lint
          npm run build

      - name: Rust check and test
        run: |
          cargo check --manifest-path src-tauri/Cargo.toml --all-targets
          cargo test --manifest-path src-tauri/Cargo.toml --all-targets

  # Compile and test macOS-only Accessibility / placement code.
  # Verify only: this job must never publish a release or upload installers.
  test-macos:
    name: test-macos
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v6.5.0
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2.9.3
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend build
        run: npm run build

      - name: Rust check and test
        run: |
          cargo check --manifest-path src-tauri/Cargo.toml --all-targets
          cargo test --manifest-path src-tauri/Cargo.toml --all-targets

