[package]
name = "keyring"
version = "0.1.2"
description = "Context-aware cross-platform radial Pie Menu launcher"
authors = ["KeyRing"]
edition = "2021"

[lib]
name = "keyring_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.1", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-clipboard-manager = "2.1"
tauri-plugin-dialog = "2.1"
tauri-plugin-autostart = "2.1"
tauri-plugin-notification = "2.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rdev = "0.5"
image = "0.25"
base64 = "0.22"
dirs = "5.0"

[target.'cfg(target_os = "macos")'.dependencies]
plist = "1.7"
icns = "0.3"
core-foundation = "0.10"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = "4.4"
urlencoding = "2.1"
